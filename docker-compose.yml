services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: viewings
      POSTGRES_PASSWORD: viewings
      POSTGRES_DB: viewings
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viewings"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.31
    ports: ["1025:1025", "8025:8025"]
